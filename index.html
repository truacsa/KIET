<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lexbox co ban</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .item {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
        }
        
        .red {
            background: red;
            height: 200px;
        }
        
        .blue {
            background: blue;
        }
        
        .green {
            background: green;
        }
        
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h2>hoc flexbox co ban</h2>
    <div class="container">
        <div class="item red">Box1</div>
        <div class="item blue">Box2</div>
        <div class="item green">Box3</div>
    </div>
</body>

</html>
